rules:
  - id: avoid-eval
    pattern: eval(...)
    message: "Avoid using eval() to prevent remote code execution vulnerabilities."
    languages: [python]
    severity: ERROR

  - id: insecure-temp-file
    pattern: tempfile.mktemp(...)
    message: "Avoid using tempfile.mktemp(); use tempfile.mkstemp() instead."
    languages: [python]
    severity: WARNING
