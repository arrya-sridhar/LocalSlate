# .gitlab-ci.yml
# LocalSlate GitLab CI/CD Pipeline

stages:
  - lint
  - format
  - type_check
  - test
  - security
  - audit
  - deploy
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/
    - web/node_modules/

# --- LINT STAGE ---
ruff-check:
  stage: lint
  image: python:3.11
  script:
    - pip install uv
    - uv venv
    - source .venv/bin/activate
    - uv pip install -r requirements.txt
    - uv pip install ruff
    - ruff check src/ tests/ tools/

eslint-web:
  stage: lint
  image: node:20
  script:
    - cd web
    - npm ci
    - npm run lint

# --- FORMAT STAGE ---
black-check:
  stage: format
  image: python:3.11
  script:
    - pip install uv
    - uv venv
    - source .venv/bin/activate
    - uv pip install -r requirements.txt
    - uv pip install black
    - black --check src/ tests/ tools/

# --- TYPE_CHECK STAGE ---
mypy-check:
  stage: type_check
  image: python:3.11
  script:
    - pip install uv
    - uv venv
    - source .venv/bin/activate
    - uv pip install -r requirements.txt
    - uv pip install mypy
    - python -m mypy src/ tests/ tools/ || true

tsc-web:
  stage: type_check
  image: node:20
  script:
    - cd web
    - npm ci
    - npx tsc --noEmit

# --- TEST STAGE ---
unit-tests:
  stage: test
  image: python:3.11
  script:
    - pip install uv
    - uv venv
    - source .venv/bin/activate
    - uv pip install -r requirements.txt
    - uv pip install pytest
    - PYTHONPATH=. python -m pytest

# --- SECURITY STAGE ---
secret_scan:
  stage: security
  image: registry.gitlab.com/gitlab-org/security-products/analyzers/secrets:3
  script:
    - /analyzer run
  allow_failure: true

# --- AUDIT STAGE ---
dependency_audit:
  stage: audit
  image: python:3.11
  script:
    - pip install uv
    - uv venv
    - source .venv/bin/activate
    - uv pip install -r requirements.txt
    - python tools/repo_audit.py

# --- DEPLOY STAGE ---
pages:
  stage: deploy
  image: node:20
  script:
    - cd web
    - npm ci
    - npm run build
    - mv out ../public
  artifacts:
    paths:
      - public
  environment:
    name: production
    url: $CI_PAGES_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- RELEASE STAGE ---
cli_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for LocalSlate..."
  release:
    name: 'LocalSlate Release $CI_COMMIT_SHORT_SHA'
    description: 'Automated release of LocalSlate.'
    tag_name: 'v1.0.$CI_PIPELINE_IID'
    ref: '$CI_COMMIT_SHA'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
