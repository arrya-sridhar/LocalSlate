stages:
  - lint
  - test

variables:
  PYTHON: 'C:\Users\srees\AppData\Local\Programs\Python\Python312\python.exe'

black-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install --upgrade pip'
    - '& "$env:PYTHON" -m pip install black'
    - '& "$env:PYTHON" -m black --check src tests tools || exit 0'

ruff-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install --upgrade pip'
    - '& "$env:PYTHON" -m pip install ruff'
    - '& "$env:PYTHON" -m ruff check src tests tools || exit 0'

mypy-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install --upgrade pip'
    - '& "$env:PYTHON" -m pip install mypy'
    - '& "$env:PYTHON" -m mypy src tests tools || exit 0'

repo-audit:
  stage: lint
  script:
    - '& "$env:PYTHON" tools/repo_audit.py || exit 0'

unit-tests:
  stage: test
  script:
    - '& "$env:PYTHON" -m pip install --upgrade pip'
    - '& "$env:PYTHON" -m pip install pytest'
    - '& "$env:PYTHON" -m pytest || exit 0'
