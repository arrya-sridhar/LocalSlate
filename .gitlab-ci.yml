# .gitlab-ci.yml
# LocalSlate GitLab CI/CD Pipeline (macOS Unix Shell Runner)

stages:
  - lint
  - format
  - type_check
  - test
  - security
  - audit
  - deploy
  - release

default:
  before_script:
    - uv venv || true
    - source .venv/bin/activate
    - uv pip install -r requirements.txt

# --- LINT STAGE ---
ruff-check:
  stage: lint
  script:
    - uv pip install ruff
    - python -m ruff check src tests tools

eslint-web:
  stage: lint
  script:
    - cd web
    - npm install
    - npm run lint

# --- FORMAT STAGE ---
black-check:
  stage: format
  script:
    - uv pip install black
    - python -m black --check src tests tools

# --- TYPE_CHECK STAGE ---
mypy-check:
  stage: type_check
  script:
    - uv pip install mypy
    - python -m mypy src tests tools || exit 0

tsc-web:
  stage: type_check
  script:
    - cd web
    - npm install
    - npx tsc --noEmit

# --- TEST STAGE ---
unit-tests:
  stage: test
  script:
    - uv pip install pytest
    - PYTHONPATH="." python -m pytest

# --- SECURITY STAGE ---
security-scan:
  stage: security
  script:
    - uv pip install bandit
    - python -m bandit -r src/ -ll
  allow_failure: true

# --- AUDIT STAGE ---
dependency_audit:
  stage: audit
  script:
    - python tools/repo_audit.py

# --- DEPLOY STAGE ---
pages:
  stage: deploy
  script:
    - cd web
    - npm install
    - npm run build
    - mv out ../public
  artifacts:
    paths:
      - public
  environment:
    name: production
    url: $CI_PAGES_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- RELEASE STAGE ---
cli_release:
  stage: release
  script:
    - echo "Release job running on Unix Shell."
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
