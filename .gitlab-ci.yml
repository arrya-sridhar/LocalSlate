# .gitlab-ci.yml
# LocalSlate GitLab CI/CD Pipeline (At least 10 checks)

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

# Job 1: Code formatting (Black)
black-check:
  stage: lint
  script:
    - pip install uv
    - uv venv
    - .venv\Scripts\activate || source .venv/bin/activate
    - uv pip install -r requirements.txt
    - uv pip install black
    - black --check src/ tests/ tools/

# Job 2: Code linting (Ruff)
ruff-check:
  stage: lint
  script:
    - pip install uv
    - uv venv
    - .venv\Scripts\activate || source .venv/bin/activate
    - uv pip install -r requirements.txt
    - uv pip install ruff
    - ruff check src/ tests/ tools/

# Job 3: Type checking (Mypy)
mypy-check:
  stage: lint
  script:
    - pip install uv
    - uv venv
    - .venv\Scripts\activate || source .venv/bin/activate
    - uv pip install -r requirements.txt
    - uv pip install mypy
    - mypy src/ tests/ tools/

# Job 4: Custom Repository Audit Checks (6 checks: AST, YAML, JSON, conflict markers, large files, whitespaces)
repo-audit:
  stage: lint
  script:
    - pip install uv
    - uv venv
    - .venv\Scripts\activate || source .venv/bin/activate
    - uv pip install -r requirements.txt
    - python tools/repo_audit.py

# Job 5: Unit testing (Pytest)
unit-tests:
  stage: test
  script:
    - pip install uv
    - uv venv
    - .venv\Scripts\activate || source .venv/bin/activate
    - uv pip install -r requirements.txt
    - uv pip install pytest
    - python -m pytest
