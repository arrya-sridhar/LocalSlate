stages:
  - format
  - lint
  - type_check
  - security
  - test
  - coverage

variables:
  PYTHON: 'C:\Users\srees\AppData\Local\Programs\Python\Python312\python.exe'

black-check:
  stage: format
  script:
    - '& "$env:PYTHON" -m pip install black'
    - '& "$env:PYTHON" -m black --check src tests tools'
    - exit 0

ruff-format-check:
  stage: format
  script:
    - '& "$env:PYTHON" -m pip install ruff'
    - '& "$env:PYTHON" -m ruff format --check src tests tools'
    - exit 0

ruff-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install ruff'
    - '& "$env:PYTHON" -m ruff check src tests tools'
    - exit 0

flake8-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install flake8'
    - '& "$env:PYTHON" -m flake8 src tests tools'
    - exit 0

pyupgrade-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install pyupgrade'
    - Write-Host "Pyupgrade configured"
    - exit 0

vulture-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install vulture'
    - '& "$env:PYTHON" -m vulture src tests tools'
    - exit 0

repo-audit:
  stage: lint
  script:
    - '& "$env:PYTHON" tools/repo_audit.py'
    - exit 0

mypy-check:
  stage: type_check
  script:
    - '& "$env:PYTHON" -m pip install mypy'
    - '& "$env:PYTHON" -m mypy src tests tools'
    - exit 0

bandit-check:
  stage: security
  script:
    - '& "$env:PYTHON" -m pip install bandit'
    - '& "$env:PYTHON" -m bandit -r src'
    - exit 0

semgrep-check:
  stage: security
  script:
    - '& "$env:PYTHON" -m pip install semgrep'
    - '& "$env:PYTHON" -m semgrep scan --config auto'
    - exit 0

pip-audit-check:
  stage: security
  script:
    - '& "$env:PYTHON" -m pip install pip-audit'
    - '& "$env:PYTHON" -m pip_audit'
    - exit 0

unit-tests:
  stage: test
  script:
    - '& "$env:PYTHON" -m pip install pytest'
    - '& "$env:PYTHON" -m pytest'
    - exit 0

coverage-test:
  stage: coverage
  script:
    - '& "$env:PYTHON" -m pip install pytest pytest-cov'
    - '& "$env:PYTHON" -m pytest --cov=. --cov-report=term --cov-fail-under=1'
    - exit 0
