stages:
  - lint
  - test

variables:
  PYTHON: 'C:\Users\srees\AppData\Local\Programs\Python\Python313\python.exe'
  PIP_CACHE_DIR: "$CI_PROJECT_DIR\.cache\pip"

cache:
  paths:
    - .cache/pip/

black-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install --upgrade pip'
    - '& "$env:PYTHON" -m pip install -r requirements.txt'
    - '& "$env:PYTHON" -m pip install black'
    - '& "$env:PYTHON" -m black --check src tests tools'

ruff-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install --upgrade pip'
    - '& "$env:PYTHON" -m pip install -r requirements.txt'
    - '& "$env:PYTHON" -m pip install ruff'
    - '& "$env:PYTHON" -m ruff check src tests tools'

mypy-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install --upgrade pip'
    - '& "$env:PYTHON" -m pip install -r requirements.txt'
    - '& "$env:PYTHON" -m pip install mypy'
    - '& "$env:PYTHON" -m mypy src tests tools'

repo-audit:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install --upgrade pip'
    - '& "$env:PYTHON" -m pip install -r requirements.txt'
    - '& "$env:PYTHON" tools/repo_audit.py'

unit-tests:
  stage: test
  script:
    - '& "$env:PYTHON" -m pip install --upgrade pip'
    - '& "$env:PYTHON" -m pip install -r requirements.txt'
    - '& "$env:PYTHON" -m pip install pytest'
    - '& "$env:PYTHON" -m pytest'
