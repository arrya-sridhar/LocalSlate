# .gitlab-ci.yml
# LocalSlate GitLab CI/CD Pipeline

stages:
  - lint
  - format
  - type_check
  - test
  - security
  - audit
  - deploy
  - release

variables:
  PYTHON: 'C:\Users\srees\AppData\Local\Programs\Python\Python312\python.exe'

# --- LINT STAGE ---
ruff-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install ruff'
    - '& "$env:PYTHON" -m ruff check src tests tools'

eslint-web:
  stage: lint
  script:
    - cd web
    - npm ci
    - npm run lint

# --- FORMAT STAGE ---
black-check:
  stage: format
  script:
    - '& "$env:PYTHON" -m pip install black'
    - '& "$env:PYTHON" -m black --check src tests tools'

# --- TYPE_CHECK STAGE ---
mypy-check:
  stage: type_check
  script:
    - '& "$env:PYTHON" -m pip install mypy'
    - '& "$env:PYTHON" -m pip install -r requirements.txt'
    - '& "$env:PYTHON" -m mypy src tests tools || exit 0'

tsc-web:
  stage: type_check
  script:
    - cd web
    - npm ci
    - npx tsc --noEmit

# --- TEST STAGE ---
unit-tests:
  stage: test
  script:
    - '& "$env:PYTHON" -m pip install pytest'
    - '& "$env:PYTHON" -m pip install -r requirements.txt'
    - '$env:PYTHONPATH = "."'
    - '& "$env:PYTHON" -m pytest'

# --- SECURITY STAGE ---
security-scan:
  stage: security
  script:
    - '& "$env:PYTHON" -m pip install bandit'
    - '& "$env:PYTHON" -m bandit -r src/ -ll'
  allow_failure: true

# --- AUDIT STAGE ---
dependency_audit:
  stage: audit
  script:
    - '& "$env:PYTHON" -m pip install -r requirements.txt'
    - '& "$env:PYTHON" tools/repo_audit.py'

# --- DEPLOY STAGE ---
pages:
  stage: deploy
  script:
    - cd web
    - npm ci
    - npm run build
    - mv out ../public
  artifacts:
    paths:
      - public
  environment:
    name: production
    url: $CI_PAGES_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- RELEASE STAGE ---
cli_release:
  stage: release
  script:
    - echo "Release job running on Windows Shell. To properly release, download artifacts manually or configure GitLab Release CLI for Windows."
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
