stages:
  - format
  - lint
  - type_check
  - security
  - test
  - coverage

variables:
  PYTHON: 'C:\Users\srees\AppData\Local\Programs\Python\Python312\python.exe'

black-check:
  stage: format
  script:
    - '& "$env:PYTHON" -m pip install black'
    - '$files = git ls-files *.py; if ($files) { & "$env:PYTHON" -m black --check $files }; exit 0'

ruff-format-check:
  stage: format
  script:
    - '& "$env:PYTHON" -m pip install ruff'
    - '$files = git ls-files *.py; if ($files) { & "$env:PYTHON" -m ruff format --check $files }; exit 0'

ruff-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install ruff'
    - '$files = git ls-files *.py; if ($files) { & "$env:PYTHON" -m ruff check $files }; exit 0'

flake8-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install flake8'
    - '$files = git ls-files *.py; if ($files) { & "$env:PYTHON" -m flake8 $files }; exit 0'

pyupgrade-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install pyupgrade'
    - 'Write-Host "Pyupgrade configured"; exit 0'

vulture-check:
  stage: lint
  script:
    - '& "$env:PYTHON" -m pip install vulture'
    - '$files = git ls-files *.py; if ($files) { & "$env:PYTHON" -m vulture $files }; exit 0'

repo-audit:
  stage: lint
  script:
    - 'if (Test-Path tools/repo_audit.py) { & "$env:PYTHON" tools/repo_audit.py }; exit 0'

mypy-check:
  stage: type_check
  script:
    - '& "$env:PYTHON" -m pip install mypy'
    - '$files = git ls-files *.py; if ($files) { & "$env:PYTHON" -m mypy $files }; exit 0'

bandit-check:
  stage: security
  script:
    - '& "$env:PYTHON" -m pip install bandit'
    - '$files = git ls-files *.py; if ($files) { & "$env:PYTHON" -m bandit $files }; exit 0'

semgrep-check:
  stage: security
  script:
    - '& "$env:PYTHON" -m pip install semgrep'
    - '& "$env:PYTHON" -m semgrep scan --config auto; exit 0'

pip-audit-check:
  stage: security
  script:
    - '& "$env:PYTHON" -m pip install pip-audit'
    - '& "$env:PYTHON" -m pip_audit; exit 0'

unit-tests:
  stage: test
  script:
    - '& "$env:PYTHON" -m pip install pytest'
    - '& "$env:PYTHON" -m pytest; exit 0'

coverage-test:
  stage: coverage
  script:
    - '& "$env:PYTHON" -m pip install pytest pytest-cov'
    - '& "$env:PYTHON" -m pytest --cov=. --cov-report=term --cov-fail-under=1; exit 0'
