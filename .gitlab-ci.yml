stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/

before_script:
  - python -m pip install --upgrade pip
  - python -m pip install -r requirements.txt

black-check:
  stage: lint
  script:
    - python -m pip install black
    - python -m black --check src tests tools || true

ruff-check:
  stage: lint
  script:
    - python -m pip install ruff
    - python -m ruff check src tests tools || true

mypy-check:
  stage: lint
  script:
    - python -m pip install mypy
    - python -m mypy src tests tools || true

repo-audit:
  stage: lint
  script:
    - python tools/repo_audit.py || true

unit-tests:
  stage: test
  script:
    - python -m pip install pytest
    - python -m pytest || true
