[tool.vulture]
paths = ["backend", "tests", "tools"]
min_confidence = 80
exclude = [".venv", "data", "frontend", "**/__pycache__"]
ignore_names = ["kwargs"]

[tool.bandit]
targets = ["backend", "tests", "tools"]
exclude_dirs = [".venv", "data", "frontend", ".git", "**/__pycache__"]
skips = [
    "B101", # Justified: assert is standard and required in pytest test suites
    "B110", # Justified: try-except-pass is used intentionally for fallback checks and safe resource cleanup (e.g. unlinking files)
    "B404", # Justified: subprocess module is required in local developer maintenance tools (repo_audit.py)
    "B603"  # Justified: subprocess execution in repo_audit.py does not take untrusted user inputs
]

[tool.pylint.master]
ignore = [".venv", "data", "frontend", "__pycache__"]
ignore-paths = [".venv/.*", "data/.*", "frontend/.*"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "duplicate-code",
    "broad-exception-caught", # Justified: Broad exception handling is used in lifespan startup/shutdown, test setup, and repo audit checks to prevent server/script crashes and report descriptive failures.
    "protected-access",        # Justified: Unit and integration tests need access to protected global service variables for isolation and resetting state.
    "import-outside-toplevel", # Justified: Deferred imports are required in test files and main.py to allow dynamic sys.path modification and prevent circular dependencies.
    "too-many-locals",         # Justified: Integration test methods contain setup, mock context, and assertion variables that exceed pylint default limits.
    "too-many-statements",     # Justified: Standard testing routines require sequence of multiple mock writes, calls, and asserts in a single method.
    "unused-argument",         # Justified: pytest fixtures and FastAPI lifespan event signatures require matching API signatures without necessarily using the arguments.
    "wrong-import-position",   # Justified: sys.path is dynamically resolved at runtime in main.py/run.py before importing source components.
    "no-member"                # Justified: Wave_read / Wave_write dynamic context outputs and library components trigger false positives in pylint's static type inference engine.
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/run.py",
    "backend/src/app/dashboard.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "except ImportError:",
    "except Exception as e:",
    "pass"
]
