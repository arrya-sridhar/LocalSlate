# .pre-commit-config.yaml
# LocalSlate DevOps Quality Configuration (10 Checks)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: "[1/10] Trim Trailing Whitespace"
      - id: end-of-file-fixer
        name: "[2/10] Fix End of Files"
      - id: check-yaml
        name: "[3/10] Validate YAML files"
      - id: check-added-large-files
        name: "[4/10] Prevent Large File Commits (Models Limit)"
        args: ['--maxkb=5000']
      - id: check-ast
        name: "[5/10] Verify Python Abstract Syntax Trees"
      - id: check-json
        name: "[6/10] Validate JSON structures"
      - id: check-merge-conflict
        name: "[7/10] Check for Git Merge Conflicts"

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        name: "[8/10] Auto-format Python Code (Black)"
        language_version: python3.11

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        name: "[9/10] Lint and Autofix (Ruff)"
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        name: "[10/10] Strict Static Type Check (Mypy)"
        additional_dependencies: [pydantic, types-psutil]
