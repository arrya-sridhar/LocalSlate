# .pre-commit-config.yaml
# LocalSlate DevOps Quality & Security Configuration

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: "Trim Trailing Whitespace"
      - id: end-of-file-fixer
        name: "Fix End of Files"
      - id: check-yaml
        name: "Validate YAML files"
      - id: check-added-large-files
        name: "Prevent Large File Commits (Models Limit)"
        args: ['--maxkb=5000']
      - id: check-ast
        name: "Verify Python Abstract Syntax Trees"
      - id: check-json
        name: "Validate JSON structures"
      - id: check-merge-conflict
        name: "Check for Git Merge Conflicts"
      - id: detect-private-key
        name: "Detect Private Keys"

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        name: "Auto-format Python Code (Black)"
        language_version: python3.11

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        name: "Lint and Autofix (Ruff)"
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        name: "Strict Static Type Check (Mypy)"
        additional_dependencies: [pydantic, types-psutil]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
